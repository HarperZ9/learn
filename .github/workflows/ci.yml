name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # The shipped runtime still needs nothing but Node. This is here because the
      # artwork gates in tools/ are Python, and tests/repo-art.test.mjs runs them.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run the full test suite (no installed dependencies)
        run: node --test
      - name: Doctor self-check (integrity invariants must report MATCH)
        run: node src/cli.mjs doctor
      - name: Status envelope smoke check
        run: node src/cli.mjs status
