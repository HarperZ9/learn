name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the release each SHA was read from.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # The shipped runtime still needs nothing but Node. Python is here because the artwork
      # gates in tools/ are Python (tests/repo-art.test.mjs runs them), and the planted-package
      # test in tests/security-spawn.test.mjs needs Python 3.11 or later for -P.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run the full test suite (no installed dependencies)
        run: node --test
      - name: Doctor self-check (integrity invariants must report MATCH)
        run: node src/cli.mjs doctor
      - name: Status envelope smoke check
        run: node src/cli.mjs status
      # The package as a person gets it: pack, then run the tarball through npx -y from an empty
      # folder (status, mcp, learn-mcp), and start the installed server from an absolute node
      # with a system-only PATH.
      - name: Pack the tarball and run it through npx
        shell: bash
        run: |
          mkdir -p packed
          npm pack --pack-destination packed
          node scripts/smoke-tarball.mjs packed/harperz9-learn-"$(node -p "require('./package.json').version")".tgz
